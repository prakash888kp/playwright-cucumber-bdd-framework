name: E2E Tests

on:
  push:
    branches: [main, python-migration]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'behave tag expression (e.g. "@smoke" or "@TC_UI_001 or @TC_API_001")'
        default: '@smoke'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: Run tests
        run: python scripts/run.py --tags "${{ github.event.inputs.tags || '@smoke' }}"
        env:
          ENV: qa
          HEADLESS: 'true'
      - name: Upload report archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/run_*/
            reports/run-history.json
          retention-days: 30
