[project]
name = "playwright-behave-bdd-framework"
version = "2.0.0"
description = "Enterprise Playwright + behave BDD framework (UI, API, RAG via Amazon Bedrock)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["reports", "logs", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# behave imports environment/steps by convention after sys.path setup
"features/*" = ["E402"]
"scripts/*" = ["E402"]
